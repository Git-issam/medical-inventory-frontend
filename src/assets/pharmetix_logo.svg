<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e8dd8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="swooshGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="swooshGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Icon group -->
  <g transform="translate(10, 20)">

    <!-- Green swoosh bottom -->
    <path d="M18,130 Q60,155 130,135 Q160,128 175,118" stroke="url(#swooshGrad2)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M12,140 Q58,168 135,147 Q165,139 180,127" stroke="url(#swooshGrad2)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Blue swoosh top -->
    <path d="M12,120 Q55,145 128,126 Q158,118 175,108" stroke="url(#swooshGrad1)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M6,110 Q50,132 125,114 Q155,106 172,98" stroke="url(#swooshGrad1)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Blue rounded square / cross background -->
    <rect x="30" y="30" width="90" height="90" rx="18" ry="18" fill="url(#blueGrad)"/>

    <!-- Medical cross (white) -->
    <rect x="70" y="44" width="12" height="62" rx="4" fill="white"/>
    <rect x="44" y="67" width="62" height="12" rx="4" fill="white"/>

    <!-- Green bar chart (right side of blue square) -->
    <rect x="122" y="85" width="9" height="35" rx="3" fill="url(#greenGrad)"/>
    <rect x="133" y="68" width="9" height="52" rx="3" fill="url(#greenGrad)"/>
    <rect x="144" y="55" width="9" height="65" rx="3" fill="url(#greenGrad)"/>

    <!-- Small green squares (sparkle top right) -->
    <rect x="148" y="38" width="7" height="7" rx="1" fill="#66bb6a" opacity="0.85"/>
    <rect x="157" y="30" width="5" height="5" rx="1" fill="#66bb6a" opacity="0.6"/>
    <rect x="160" y="40" width="4" height="4" rx="1" fill="#66bb6a" opacity="0.5"/>

  </g>

  <!-- "Pharmetix" wordmark -->
  <text x="195" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#blueGrad)">Pharm</text>
  <text x="368" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#greenGrad)">etix</text>

  <!-- Tagline -->
  <text x="196" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-style="italic" fill="#555555">Where Medicine Meets Management</text>
</svg>
